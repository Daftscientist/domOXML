name: Temporary Microsoft PowerPoint reference
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-powerpoint-reference.yml'
      - '.github/temporary-powerpoint-reference/**'
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install asset tooling
        run: python -m pip install Pillow requests
      - name: Download original current Microsoft PowerPoint screenshot
        run: python .github/temporary-powerpoint-reference/download.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-microsoft-powerpoint-reference
          path: powerpoint-shell-reference/
          retention-days: 1
